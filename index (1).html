function svcAll(){let n=0,s=0;G.phones.forEach(p=>{if(p.status=='repair')return;const b=repBest(p);if(!b||b.g<=0||G.money<b.sv)return;G.money-=b.sv;p.inv+=b.sv;p.status='repair';p.ready=G.day+1;p.fix=b.k;n++;s+=b.sv});G.fixes=(G.fixes||0)+n;log(n?`🏪 В сервис отдано телефонов: ${n} на ${rub(s)}. Будут готовы завтра.`:'Нет выгодных ремонтов или не хватает денег.');render()}
function repApp(){
 const g=G,bg='linear-gradient(135deg,#1abc9c,#0f766e)';
 const NT=()=>{const t=g.note?`<div class=wr style="margin:12px">${g.note}</div>`:'';g.note='';return t};
 const fixable=p=>p.status!='repair'&&p.defects.some(d=>D[d].cost);
 const all=g.phones.filter(p=>p.status=='repair'||fixable(p)),inShop=all.filter(p=>p.status=='repair'),fix=all.filter(fixable);
 const pot=fix.reduce((a,p)=>a+p.defects.filter(d=>D[d].cost).reduce((s,d)=>s+mv(p)*D[d].pen-p.base*D[d].cost,0),0);
 const list=(repF=='fix'?fix:repF=='shop'?inShop:all).slice().sort((a,b)=>{const x=repBest(a),y=repBest(b);return(y?y.g:-1e9)-(x?x.g:-1e9)});
 const worth=fix.filter(p=>{const b=repBest(p);return b&&b.g>0});
 const chip=(k,t)=>`<button ${repF==k?'class=pr':''} onclick="repF='${k}';go('stub',ci)">${t}</button>`;
 const card=p=>{const best=repBest(p);
  const head=`<div style="display:flex;gap:12px"><div style="width:96px;flex:none;border-radius:12px;overflow:hidden">${img(p)}</div><div><b>${p.name}</b><br><span class=m>Куплен за ${rub(p.buy)} · вложено ${rub(p.inv)}</span>${p.status=='repair'?`<br><b style="color:#1abc9c">🏪 В мастерской до дня ${p.ready}</b>`:best?`<br><span class=ok>Потенциал: +${rub(Math.max(0,best.g))}</span>`:''}</div></div>`;
  if(p.status=='repair')return`<div class=bx style="margin:10px 0">${head}</div>`;
  return`<div class=bx style="margin:10px 0">${head}${p.defects.filter(d=>D[d].cost).map(k=>{const d=D[k],sv=r50(p.base*d.cost),df=Math.max(100,r50(p.base*d.cost*.4)),ex=r50(p.base*d.cost*1.6),gain=Math.round(mv(p)*d.pen),net=gain-sv,ch=Math.round(chance(k)*100),isBest=best&&best.k==k&&net>0;
   return`<div style="border-top:1px solid var(--bd);margin-top:10px;padding-top:10px"><b>${d.n}</b>${isBest?' <span class=ok>⭐ выгоднее всего</span>':''}<br><span class=m>Цена вырастет на ~${rub(gain)} · чистая выгода ${net>=0?'+':''}${rub(net)}</span><div style="height:6px;border-radius:3px;background:var(--bd);margin:8px 0 2px"><div style="height:100%;width:${ch}%;background:#1abc9c;border-radius:3px"></div></div><span class=m>Шанс починить самому: ${ch}%</span><div class=g><button onclick="diy(${p.id},'${k}');go('stub',ci)">🔧 Сам: ${rub(df)}</button><button onclick="svc(${p.id},'${k}');go('stub',ci)">🏪 Сервис: ${rub(sv)}<br><span class=m>за 1 день</span></button></div><div class=g style="grid-template-columns:1fr"><button class=pr onclick="svcX(${p.id},'${k}');go('stub',ci)">⚡ Экспресс: ${rub(ex)} · сразу и 100%</button></div></div>`}).join('')}</div>`};
 return hd('Ремонт',bg)+`<div style="background:${bg};color:#fff;padding:0 16px 20px"><div>Можно заработать на ремонте</div><div style="font-size:44px;font-weight:700">${rub(Math.max(0,pot))}</div><div class=chs style="flex-wrap:wrap"><button>Телефонов: ${g.phones.length}</button><button>Нужен ремонт: ${fix.length}</button><button>В мастерской: ${inShop.length}</button><button>Навык: ${Math.round(g.skill*100)}%</button><button>Ремонтов: ${g.fixes||0}</button></div></div>${NT()}<div class=bx>✨ Сам: дёшево, но есть риск порвать шлейф. 🏪 Сервис: надёжно, готово через день. ⚡ Экспресс: в 1,6 раза дороже обычного сервиса, зато мгновенно и без риска.</div><div style="padding:0 12px"><div class=g style="grid-template-columns:repeat(3,1fr)">${chip('all','Все ('+all.length+')')}${chip('fix','Чинить ('+fix.length+')')}${chip('shop','В сервисе ('+inShop.length+')')}</div>${worth.length?`<button class=pr style="width:100%;margin:10px 0" onclick="svcAll();go('stub',ci)">🏪 Отдать выгодные в сервис (${worth.length})</button>`:''}<h2 style="font-size:22px">Ваши телефоны</h2>${list.length?list.map(card).join(''):'<p style="text-align:center;margin:40px 0"><b>Нет телефонов для ремонта</b><br><span class=m>Купите телефон в «Перекупе»: выгоднее всего чинить те, что с трещиной или потёртостями.</span></p>'}</div>`}

/* ===== Новая карточка телефона («Мои телефоны») ===== */
function pc(p){
 const val=r100(mv(p)*(1-pen(p.defects))),prof=val-p.buy-p.inv;
 const chips=p.defects.length?p.defects.map(k=>`<span style="display:inline-block;background:#3a2a0a;color:#ffcf6b;border-radius:10px;padding:3px 9px;font-size:12px;margin:2px 4px 2px 0">${D[k].n}</span>`).join(''):'<span class=ok>✔ Дефектов нет</span>';
 let h=`<div class=cd><div style="display:flex;gap:12px"><div style="width:96px;flex:none;border-radius:12px;overflow:hidden">${img(p)}</div><div style="flex:1;min-width:0"><b>${p.name}</b><div class=m>Куплен за ${rub(p.buy)}${p.inv?` · вложено ${rub(p.inv)}`:''}</div><div class=m>Рыночная цена ≈ ${rub(val)}</div><div class="${prof>=0?'ok':'bad'}"><b>${prof>=0?'+':''}${rub(prof)}</b> <span class=m>возможная прибыль</span></div></div></div><div style="margin:8px 0">${chips}</div>`;
 if(p.status=='repair')return h+`<p class=m>🏪 В сервисе до дня ${p.ready}</p></div>`;
 if(p.status=='busy')return h+`<p class=m>Покупатель торгуется…</p></div>`;
 if(p.status=='listed')return h+`<p>🏷 Выставлен за <b>${rub(p.ask)}</b> (${T[p.tier][2]})${p.hide?' · дефекты скрыты':''}</p><button onclick="unlist(${p.id})">Снять с продажи</button></div>`;
 const pb=(on,fn,label,hint)=>`<button ${on?'disabled':''} onclick="${fn}(${p.id})">${label}${on?' ✓':''}<br><span class=m>${hint}</span></button>`;
 h+=`<div class=m style="margin-top:10px"><b>Подготовка</b></div><div class=g style="grid-template-columns:repeat(3,1fr)">${pb(p.clean,'clean','🧽 Чистка','+5% к цене')}${pb(p.glass,'glass','🛡 Стекло','150 ₽ · +3%')}${pb(p.photo,'photo','📸 Фото','+5% к цене')}</div>`;
 const fx=p.defects.filter(k=>D[k].cost);
 if(fx.length)h+=`<div class=m style="margin-top:10px"><b>Ремонт</b></div>`+fx.map(k=>{const d=D[k],sv=r50(p.base*d.cost),df=Math.max(100,r50(p.base*d.cost*.4)),ex=r50(p.base*d.cost*1.6),net=Math.round(mv(p)*d.pen)-sv;
  return`<div style="border-top:1px solid var(--bd);padding-top:8px;margin-top:8px"><b style="font-size:14px">${d.n}</b><br><span class=m>выгода ${net>=0?'+':''}${rub(net)} · шанс самому ${Math.round(chance(k)*100)}%</span><div class=g style="grid-template-columns:repeat(3,1fr)"><button onclick="diy(${p.id},'${k}')">🔧 Сам<br><span class=m>${rub(df)}</span></button><button onclick="svc(${p.id},'${k}')">🏪 Сервис<br><span class=m>${rub(sv)} · 1 день</span></button><button class=pr onclick="svcX(${p.id},'${k}')">⚡ Сразу<br><span class=m>${rub(ex)}</span></button></div></div>`}).join('');
 h+=`<div class=m style="margin-top:12px"><b>Продажа</b>${p.defects.length?` <label style="float:right"><input type=checkbox ${p.hideOpt?'checked':''} onchange="hideOpt(${p.id},this.checked)"> скрыть дефекты</label>`:''}</div><div class=g style="grid-template-columns:repeat(3,1fr)">${Object.keys(T).map(t=>{const a=askP(p,t),pr=a-p.buy-p.inv;return`<button onclick="list(${p.id},'${t}')">${T[t][2]}<br><b>${rub(a)}</b><br><span class=${pr>=0?'ok':'bad'}>${pr>=0?'+':''}${rub(pr)}</span></button>`}).join('')}</div><div class=g style="grid-template-columns:1fr"><button onclick="quick(${p.id})">⚡ Скупке сразу: ${rub(quickV(p))}</button></div></div>`;
 return h}
</script><script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
